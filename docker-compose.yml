services:
  mongodb:
    image: mongo:latest
    container_name: chatweb-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - chatweb-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatweb-backend
    restart: unless-stopped
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/chatweb
      - JWT_SECRET=Abdo_66
      - CLOUDINARY_CLOUD_NAME=duhum1zna
      - CLOUDINARY_API_KEY=238483654863626
      - CLOUDINARY_API_SECRET=w-xLJHF0Rg-VbtXXJ488ALDFWRE
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - chatweb-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatweb-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - chatweb-network

volumes:
  mongo-data:

networks:
  chatweb-network:
    driver: bridge
